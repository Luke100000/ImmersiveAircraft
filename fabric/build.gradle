plugins {
    id "net.fabricmc.fabric-loom" version "${fabric_loom_version}"
}

sourceSets {
    main {
        java.srcDir rootProject.file("common/src/main/java")
        resources.srcDir rootProject.file("common/src/main/resources")
        java.exclude "immersive_aircraft/combat/REICombat.java"
    }
}

loom {
    accessWidenerPath = rootProject.file("common/src/main/resources/immersive_aircraft.accessWidener")

    mods {
        "immersive_aircraft" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"
    include "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"

    compileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name
            version = "${project.version}+fabric"
            from components.java
        }
    }
}
