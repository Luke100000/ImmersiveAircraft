buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.+'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

version = project.mod_version
group = 'net.conczin'
archivesBaseName = project.archives_base_name

sourceCompatibility = targetCompatibility = '1.8'

compileJava {
    options.encoding = 'UTF-8'
}

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = 'run'
    mappings = project.mcp_mappings
}

// FG2.3 quirk: when only resources change, `jar` re-executes during `build` and
// overwrites the artifact with the non-reobfuscated variant while reobfJar stays
// up-to-date (it only watches classes). Never skip reobfJar so the shipped jar
// always contains SRG names.
reobfJar.outputs.upToDateWhen { false }

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'immersive_aircraft',
            'Specification-Vendor'  : 'conczin',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'conczin'
        ])
    }
}
