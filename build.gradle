def getAppVersion = { ->
    try {
        def proc = new ProcessBuilder("git", "tag", "--points-at", "HEAD")
                .directory(rootProject.projectDir)
                .redirectErrorStream(true)
                .start()
        def tag = proc.inputStream.getText("UTF-8").trim()
        proc.waitFor()
        return tag.endsWith("+${rootProject.minecraft_version}") ? tag : "${rootProject.minecraft_version}-SNAPSHOT"
    } catch (Exception e) {
        println "Warning: ${e.message}, is git installed?"
        return "${rootProject.minecraft_version}-DEV"
    }
}

allprojects {
    group = rootProject.group_id
    version = getAppVersion()
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    repositories {
        mavenCentral()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://maven.blamejared.com/" }
        maven {
            url "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven { url "https://maven.parchmentmc.org" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://dvs1.progwml6.com/files/maven/" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://nexus.resourcefulbees.com/repository/maven-public/" }
        maven { url "https://maven.teamresourceful.com/repository/maven-public/" }
        maven { url "https://cursemaven.com" }
        maven { url "https://maven.conczin.net/Artifacts" }
    }

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.withType(ProcessResources).configureEach {
        exclude "**/*.aup3", "**/.xdp-*", "**/*.kra", "**/*~*"
    }

    tasks.named("sourcesJar").configure {
        exclude "**/*.aup3", "**/.xdp-*", "**/*.kra", "**/*~*"
    }

    publishing {
        repositories {
            maven {
                name = "reposiliteRepository"
                url = uri("https://maven.conczin.net/Artifacts")
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_TOKEN")
                }
            }
        }
    }
}
