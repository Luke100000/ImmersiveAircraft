plugins {
    id "fabric-loom" version "${fabric_loom_version}"
}

sourceSets {
    main {
        java.srcDir rootProject.file("common/src/main/java")
        resources.srcDir rootProject.file("common/src/main/resources")
    }
}

loom {
    accessWidenerPath = project.rootProject.file("common/src/main/resources/immersive_aircraft.accessWidener")

    mods {
        "immersive_aircraft" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modLocalRuntime "maven.modrinth:iris:${iris_version}"
    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"

    // Loom strips Iris's nested libraries when remapping it for development.
    localRuntime("org.anarres:jcpp:1.4.14") { transitive false }
    localRuntime("io.github.douira:glsl-transformer:2.0.1") { transitive false }
    localRuntime "org.antlr:antlr4-runtime:4.13.1"

    implementation "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"
    include "org.mariuszgromada.math:MathParser.org-mXparser:5.2.1"

    modCompileOnly("com.terraformersmc:modmenu:${mod_menu_version}") { transitive false }
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        exclude(group: "me.shedaniel.cloth", module: "cloth-config")
    }

    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api-intermediary:${jei_version}"
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}") { transitive false }
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}") { transitive false }

    modCompileOnly("earth.terrarium.adastra:ad_astra-fabric-${ad_astra_version}") { transitive false }
}

apply from: rootProject.file("gradle/controller-dependencies.gradle")

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name
            version = "${project.version}+fabric"
            from components.java
        }
    }
}
